services:
  - type: web
    name: bybit-ai-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BYBIT_MODE
        value: demo
      - key: LIVE_TRADING_ARMED
        value: 'false'
      - key: AUTO_ENABLED
        value: 'false'
      - key: STRATEGY_MODE
        value: normal
      - key: STRATEGY_MODE
        value: normal
      - key: RUN_TRADER_IN_WEB
        value: 'false'
      - key: DEMO_TRADING_BUDGET
        value: '100'
      - key: DEMO_MAX_DAILY_LOSS
        value: '20'
      - key: DEMO_RISK_PCT
        value: '2'
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: bybit-ai-agent-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BYBIT_MODE
        value: demo
      - key: LIVE_TRADING_ARMED
        value: 'false'
      - key: AUTO_ENABLED
        value: 'false'
      - key: DEMO_TRADING_BUDGET
        value: '100'
      - key: DEMO_MAX_DAILY_LOSS
        value: '20'
      - key: DEMO_RISK_PCT
        value: '2'
      - key: DATABASE_URL
        sync: false
