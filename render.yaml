services:
  - type: web
    name: bybit-ai-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BYBIT_MODE
        value: demo
      - key: LIVE_TRADING_ARMED
        value: 'false'
      - key: AUTO_ENABLED
        value: 'true'
      - key: STRATEGY_MODE
        value: both
      - key: RUN_TRADER_IN_WEB
        value: 'false'
      - key: DEMO_TRADING_BUDGET
        value: '100'
      - key: MAX_POSITIONS
        value: '8'
      - key: DEFAULT_LEVERAGE
        value: '10'
      - key: LEVERAGE_MODE
        value: fixed
      - key: TOTAL_OPEN_RISK_PCT
        value: '8'
      - key: FULL_MARKET_DEFAULT
        value: 'true'
      - key: FULL_MARKET_WORKERS
        value: '4'
      - key: DEMO_MAX_DAILY_LOSS
        value: '20'
      - key: DEMO_RISK_PCT
        value: '2'
      - key: BOT_BASE_CAPITAL
        value: '10'
      - key: PROFIT_LOCK_STEP
        value: '5'
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: bybit-ai-agent-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BYBIT_MODE
        value: demo
      - key: LIVE_TRADING_ARMED
        value: 'false'
      - key: AUTO_ENABLED
        value: 'false'
      - key: DEMO_TRADING_BUDGET
        value: '100'
      - key: DEMO_MAX_DAILY_LOSS
        value: '20'
      - key: DEMO_RISK_PCT
        value: '2'
      - key: DATABASE_URL
        sync: false
